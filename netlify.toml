# =============================================================================
# netlify.toml — le dice a Netlify dónde está cada cosa
# =============================================================================
[build]
  # Carpeta con lo que ve el público (index.html).
  publish = "public"
  # Carpeta con las funciones de servidor (el intermediario con Gemini).
  # Tiene que estar FUERA de "public", si no el código quedaría descargable.
  functions = "netlify/functions"

# La librería que lee PDF (unpdf) necesita Node 22 o más nuevo.
# Netlify usa esta misma versión para construir y para ejecutar la función.
[build.environment]
  NODE_VERSION = "22"

# No hay "command" a propósito: no hay nada que compilar.
# Netlify instala solo las librerías de package.json (unpdf y mammoth).
# IMPORTANTE: la clave GEMINI_API_KEY NO se escribe acá.
# Se carga en el panel de Netlify (Environment variables).
